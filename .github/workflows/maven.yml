
name: Serenity BDD - SauceDemo E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Ejecutar pruebas E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas Serenity BDD
        run: mvn -B -ntp clean verify -Dheadless.mode=true

      - name: Publicar reportes Serenity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serenity-e2e-report
          path: |
            target/site/serenity/
            target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 30
